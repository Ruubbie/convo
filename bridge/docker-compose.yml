services:
  bridge:
    build: .
    restart: unless-stopped
    environment:
      BRIDGE_TOKEN: ${BRIDGE_TOKEN:?set BRIDGE_TOKEN in .env}
      SIGNAL_API: http://signal:8080
    ports:
      - "${BRIDGE_PORT:-8080}:8080"
    volumes:
      - bridge-data:/data
    depends_on:
      - signal

  # Signal linked device. Not published on the host: only the bridge talks to it.
  signal:
    image: bbernhard/signal-cli-rest-api:latest
    restart: unless-stopped
    environment:
      MODE: json-rpc
    volumes:
      - signal-data:/home/.local/share/signal-cli

volumes:
  bridge-data:
  signal-data:
